<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Figgy To-do</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Figgy">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F100D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --bg:#0F100D; --bg2:#161712;
  --t1:#F2EBDC; --t2:#B6AD99; --t3:#7C7668;
  --matcha:#8DAE52; --matcha-lt:#B4CC84; --matcha-dk:#6F8F36; --on-matcha:#12160B;
  --latte:#C9A882; --foam:#EFE4D0; --danger:#E2705F;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--t1);
  font-family:"Nunito",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px)}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
.app{max-width:480px;margin:0 auto;position:relative;z-index:1}

/* ---------- Nền: lưới mờ ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 60%,transparent);
          mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 60%,transparent)}

/* ---------- Liquid glass ---------- */
.glass{position:relative;isolation:isolate;border-radius:28px;
  background:linear-gradient(150deg,rgba(255,250,240,.13),rgba(255,250,240,.04) 55%,rgba(255,250,240,.07));
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid rgba(255,250,240,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05),
             inset 0 0 22px rgba(255,250,240,.04),0 14px 34px rgba(0,0,0,.38)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 18% 0%,rgba(255,255,255,.16),transparent 45%),
             radial-gradient(80% 60% at 100% 100%,rgba(201,168,130,.10),transparent 60%)}

/* ---------- Hero / Figgy ---------- */
.top{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 10px}
.date{font-size:13px;font-weight:700;color:var(--t2);letter-spacing:.04em;text-transform:uppercase}
.streak{font-size:15px;font-weight:900;padding:6px 13px 6px 10px;border-radius:999px;color:var(--t3);display:flex;gap:5px;align-items:center;
  transition:box-shadow .4s,color .4s}
.streak b{display:inline-block;min-width:10px;text-align:center;font-variant-numeric:tabular-nums}
.streak .numwrap{overflow:hidden;display:inline-flex;height:20px;align-items:center}
.fl{width:18px;height:20px;display:block;transform-origin:50% 92%;overflow:visible}
.fl .o{fill:#45443E;transition:fill .4s}
.fl .i{fill:#605E55;transition:fill .4s}
.streak.lit{color:#FFB65C;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 18px rgba(255,120,40,.35),0 14px 34px rgba(0,0,0,.38)}
.streak.lit .fl .o,.sp-flame .o{fill:url(#flameG)}
.streak.lit .fl .i,.sp-flame .i{fill:#FFE6A6}
.streak.lit .fl{animation:flick 1.3s ease-in-out infinite;filter:drop-shadow(0 0 5px rgba(255,120,40,.7))}
.streak.risk{color:var(--t2)}
.streak.risk .fl .o{fill:#7A5A3E}
.streak.risk .fl{animation:risk 2.2s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.94,1.08) skewX(-3deg)}50%{transform:scale(1.04,.96) skewX(2deg)}75%{transform:scale(.97,1.05) skewX(-1.5deg)}}
@keyframes risk{0%,100%{opacity:1}50%{opacity:.55}}
.sp-scrim{position:fixed;inset:0;z-index:19;background:rgba(8,8,6,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:none}
.sp{position:fixed;left:50%;top:40%;z-index:20;pointer-events:none;width:0;height:0}
.sp-in{position:absolute;left:-110px;top:-120px;width:220px;display:flex;flex-direction:column;align-items:center}
.sp-flame svg{width:124px;height:134px;display:block;transform-origin:50% 92%;animation:flick 1.1s ease-in-out infinite;
  filter:drop-shadow(0 0 26px rgba(255,110,40,.65))}
.sp-num{font-size:60px;font-weight:900;line-height:1;margin-top:-4px;color:#FFF3DC;text-shadow:0 4px 22px rgba(255,100,40,.6)}
.sp-txt{font-size:16px;font-weight:800;color:#FFD9A8;margin-top:4px}

.hero{padding:16px 18px 18px;display:flex;flex-direction:column;align-items:center}
.figgy-zone{position:relative;width:176px;height:166px;margin-top:2px;touch-action:manipulation}
#figWrap{position:absolute;inset:0;transform-origin:50% 92%;will-change:transform}
#figgy{width:100%;height:100%;overflow:visible;display:block}
.fshadow{position:absolute;left:50%;bottom:-4px;width:118px;height:16px;margin-left:-59px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent);will-change:transform}
#figgy .star{opacity:0;transition:opacity .2s}
#figgy.starry .star{opacity:1;animation:twinkle 1s ease-in-out infinite}
#figgy.starry .star.s2{animation-delay:.35s}
#figgy.starry .dot{opacity:0}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.45}}
#figgy .happy,#figgy .blush,#figgy .mouth{opacity:0;transition:opacity .18s}
#figgy.happyface .happy,#figgy.happyface .blush,#figgy.happyface .mouth{opacity:1}
#figgy.happyface #fEyes{opacity:0}
#fEyes{transition:opacity .12s}
#figgy .shine{opacity:0;transition:opacity .25s}
#figgy.sparkle .shine{opacity:1}
#figgy.sparkle .dot{opacity:0}
#figgy.sparkle .hl1{animation:glint 1.1s ease-in-out infinite}
#figgy.sparkle .hl2{animation:glint 1.1s ease-in-out .4s infinite}
#figgy.sparkle .hl3{animation:glint .9s ease-in-out .2s infinite}
@keyframes glint{0%,100%{opacity:1}50%{opacity:.55}}

.bubble{margin-top:12px;padding:10px 16px;border-radius:18px;font-weight:700;font-size:15px;text-align:center;
  max-width:300px;line-height:1.35;color:var(--foam)}
.bubble.pop{animation:pop .45s var(--spring)}
@keyframes pop{0%{transform:scale(.9)}100%{transform:none}}

.progress{width:100%;margin-top:16px}
.prow{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--t2);margin-bottom:8px}
.prow b{color:var(--t1)}
.track{height:10px;border-radius:999px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 2px rgba(0,0,0,.4);overflow:hidden}
.fill{height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--matcha-dk),var(--matcha) 45%,var(--latte) 85%,var(--foam));
  box-shadow:0 0 12px rgba(141,174,82,.5);transition:width .6s var(--spring)}

/* ---------- Danh sách ---------- */
.tabs{display:flex;padding:4px;border-radius:999px;margin:20px 0 14px;overflow:hidden}
.tabs button{flex:1;padding:11px 0;border-radius:999px;font-size:14px;font-weight:800;color:var(--t2);position:relative;z-index:1;
  display:flex;justify-content:center;align-items:center;gap:7px;transition:color .25s}
.tabs button.on{color:var(--on-matcha)}
.tabs em{font-style:normal;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(255,250,240,.1);transition:background .25s}
.tabs button.on em{background:rgba(18,22,11,.16)}
.tabs em:empty{display:none}
.tabs i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;z-index:0;
  background:linear-gradient(180deg,var(--matcha-lt),var(--matcha));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 14px rgba(141,174,82,.3);
  transition:transform .42s cubic-bezier(.32,.72,0,1)}
.tabs.right i{transform:translateX(100%)}
ul.in-l{animation:inL .38s var(--ease)}
ul.in-r{animation:inR .38s var(--ease)}
@keyframes inL{from{opacity:0;transform:translateX(-26px)}}
@keyframes inR{from{opacity:0;transform:translateX(26px)}}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{position:relative;border-radius:22px;overflow:hidden}
li.enter{animation:liIn .5s var(--spring) both}
@keyframes liIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
li.leave{animation:liOut .28s ease-in forwards}
@keyframes liOut{to{opacity:0;transform:translateX(-40px) scale(.96)}}
.delbg{position:absolute;inset:0;display:flex;justify-content:flex-end;align-items:center;padding-right:4px;pointer-events:none}
.delbtn{pointer-events:auto;height:calc(100% - 10px);width:44px;border-radius:999px;display:grid;place-items:center;color:#fff;
  opacity:0;transform:scale(.35);transform-origin:100% 50%;will-change:width,transform,opacity;
  background:linear-gradient(180deg,rgba(255,132,112,.9),rgba(222,84,68,.9));
  -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.18),0 8px 22px rgba(226,92,75,.35)}
.delbtn svg{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
li.commit .delbtn{background:linear-gradient(180deg,#FF876E,#E24A38)}
li.commit .delbtn svg{transform:scale(1.28)}
.row{display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:22px;touch-action:pan-y;will-change:transform;
  transition:box-shadow .25s}
li.swiping .row{box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.05),0 18px 40px rgba(0,0,0,.5)}
.check{width:28px;height:28px;flex:none;border-radius:50%;position:relative;
  border:2px solid rgba(242,235,220,.28);background:rgba(0,0,0,.15);transition:border-color .2s}
.check::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--matcha);
  transform:scale(0);transition:transform .38s var(--spring)}
.check svg{position:absolute;inset:0;margin:auto;z-index:1}
.check path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease .1s}
li.done .check{border-color:var(--matcha)}
li.done .check::before{transform:scale(1)}
li.done .check path{stroke-dashoffset:0}
.txt{flex:1;font-size:16px;font-weight:600;line-height:1.35;word-break:break-word;transition:color .25s}
li.done .txt{color:var(--t3);text-decoration:line-through;text-decoration-color:rgba(124,118,104,.8)}
.tag{font-size:11px;font-weight:800;color:var(--latte);opacity:.8}
.empty{text-align:center;color:var(--t3);font-size:14px;font-weight:600;padding:18px 0 6px}
.hint{text-align:center;color:var(--t3);font-size:12px;margin-top:18px}
footer{text-align:center;color:#4F4B41;font-size:11px;font-weight:700;margin-top:26px;letter-spacing:.04em}

.perm{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;margin-top:14px;border-radius:22px;font-size:14px;font-weight:600;color:var(--t2)}
.perm b{color:var(--t1)}
.perm span{flex:1}
.perm button{padding:9px 14px;border-radius:999px;font-weight:800;font-size:13px;color:var(--on-matcha);
  background:linear-gradient(180deg,var(--matcha-lt),var(--matcha))}
/* ---------- Lớp phủ đáy: mờ + blur tăng dần từ trên xuống ---------- */
.bfade{position:fixed;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom) + 150px);z-index:4;pointer-events:none}
.bfade i{position:absolute;inset:0}
.bfade .l1{-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 30%);mask-image:linear-gradient(to bottom,transparent 0%,#000 30%)}
.bfade .l2{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  -webkit-mask-image:linear-gradient(to bottom,transparent 25%,#000 60%);mask-image:linear-gradient(to bottom,transparent 25%,#000 60%)}
.bfade .l3{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  -webkit-mask-image:linear-gradient(to bottom,transparent 50%,#000 85%);mask-image:linear-gradient(to bottom,transparent 50%,#000 85%)}
.bfade .tint{background:linear-gradient(to bottom,rgba(15,16,13,0) 0%,rgba(15,16,13,.55) 55%,rgba(15,16,13,.9) 100%)}
/* ---------- Thanh nhập (dưới) ---------- */
.composer{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:5;
  max-width:480px;margin:0 auto;padding:8px;border-radius:999px}
.inrow{display:flex;gap:8px;align-items:center}
.inrow input{flex:1;min-width:0;height:48px;border-radius:999px;border:1px solid rgba(255,250,240,.1);
  background:rgba(0,0,0,.28);padding:0 18px;font-size:16px;font-weight:600;outline:none;transition:border-color .2s}
.inrow input::placeholder{color:var(--t3)}
.inrow input:focus{border-color:rgba(141,174,82,.6)}
.add{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--matcha-lt),var(--matcha));color:var(--on-matcha);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px rgba(141,174,82,.35);transition:transform .3s var(--spring)}
.add:active{transform:scale(.88)}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:6;transform:translate(-50%,20px);
  opacity:0;pointer-events:none;padding:10px 10px 10px 18px;border-radius:999px;display:flex;gap:12px;align-items:center;
  font-size:14px;font-weight:700;transition:opacity .25s,transform .4s var(--spring);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{padding:7px 14px;border-radius:999px;background:rgba(141,174,82,.22);color:var(--matcha-lt);font-weight:800;font-size:13px}

/* ---------- Hạt confetti / lấp lánh ---------- */
.fx{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.fx span{position:absolute;display:block;will-change:transform,opacity}

.sync{position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:12px;z-index:7;font-size:11px;font-weight:700;color:var(--t3)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div></div>
<div class="fx" id="fx"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="flameG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF3B4E"/><stop offset=".5" stop-color="#FF7A1A"/><stop offset="1" stop-color="#FFC93C"/></linearGradient>
</defs></svg>

<div class="app">
  <div class="top">
    <div class="date" id="date"></div>
    <button type="button" class="streak glass" id="streak" aria-label="Chuỗi ngày"><svg class="fl" viewBox="0 0 24 26"><path class="o" d="M12 1c.6 3.5 2.9 5.3 4.6 7.3C18.5 10.4 20 12.6 20 15.6a8 8 0 0 1-16 0c0-2.6 1.1-4.6 2.7-6.1.2 1.7 1 2.9 2.2 3.5C8.6 9 10.1 4.4 12 1z"/><path class="i" d="M12 12c.35 1.8 1.5 2.7 2.3 3.8.55.7 1 1.5 1 2.5a3.3 3.3 0 0 1-6.6 0c0-1.2.55-2.2 1.3-2.9.1.8.55 1.3 1.1 1.55-.1-1.9.35-3.6.9-4.95z"/></svg><span class="numwrap"><b id="streakN">0</b></span></button>
  </div>

  <section class="hero glass">
    <div class="figgy-zone" id="figZone">
      <div class="fshadow" id="fShadow"></div>
      <div id="figWrap">
        <svg id="figgy" viewBox="140 200 720 680" aria-label="Figgy">
          <defs>
            <clipPath id="mcl"><path transform="translate(206.7247 240.383)" d="M 19.83 252.77 C -7.75 153.96 -5.45 64.34 19.83 0 C 93.36 32.17 157.70 82.72 208.25 151.66 L 150 300 L 60 310 Z"/></clipPath>
            <clipPath id="mcr"><path transform="translate(585.0213 240.383)" d="M 188.43 252.77 C 216 153.96 213.70 64.34 188.43 0 C 114.89 32.17 50.55 82.72 0 151.66 L 58 300 L 148 310 Z"/></clipPath>
            <radialGradient id="gloss" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
            <clipPath id="mcb"><path d="M 176 605.7447 A 324 245.8723 0 1 0 824 605.7447 A 324 245.8723 0 1 0 176 605.7447 Z"/></clipPath>
          </defs>
          <g id="fHead">
            <g id="fEarL"><g clip-path="url(#mcl)">
              <path transform="translate(206.7247 240.383)" d="M 19.83 252.77 C -7.75 153.96 -5.45 64.34 19.83 0 C 93.36 32.17 157.70 82.72 208.25 151.66 L 150 300 L 60 310 Z" fill="#D9DDD2"/>
              <path transform="translate(-34 -26) translate(206.7247 240.383)" d="M 19.83 252.77 C -7.75 153.96 -5.45 64.34 19.83 0 C 93.36 32.17 157.70 82.72 208.25 151.66 L 150 300 L 60 310 Z" fill="#fff"/>
            </g></g>
            <g id="fEarR"><g clip-path="url(#mcr)">
              <path transform="translate(585.0213 240.383)" d="M 188.43 252.77 C 216 153.96 213.70 64.34 188.43 0 C 114.89 32.17 50.55 82.72 0 151.66 L 58 300 L 148 310 Z" fill="#D9DDD2"/>
              <path transform="translate(-34 -26) translate(585.0213 240.383)" d="M 188.43 252.77 C 216 153.96 213.70 64.34 188.43 0 C 114.89 32.17 50.55 82.72 0 151.66 L 58 300 L 148 310 Z" fill="#fff"/>
            </g></g>
            <g id="fBody"><g clip-path="url(#mcb)">
              <path d="M 176 605.7447 A 324 245.8723 0 1 0 824 605.7447 A 324 245.8723 0 1 0 176 605.7447 Z" fill="#D9DDD2"/>
              <path transform="translate(-34 -26)" d="M 176 605.7447 A 324 245.8723 0 1 0 824 605.7447 A 324 245.8723 0 1 0 176 605.7447 Z" fill="#fff"/>
            </g></g>
            <g class="blush"><ellipse cx="318" cy="668" rx="38" ry="20" fill="#F0A99C" opacity=".75"/><ellipse cx="676" cy="668" rx="38" ry="20" fill="#F0A99C" opacity=".75"/></g>
            <g id="fEyes">
              <g id="fEyeL">
                <path d="M391 638C413.091 638 431 609.794 431 575C431 540.206 413.091 512 391 512C368.909 512 351 540.206 351 575C351 609.794 368.909 638 391 638Z" fill="#121212"/>
                <path class="dot" d="M391 569C397.627 569 403 561.165 403 551.5C403 541.835 397.627 534 391 534C384.373 534 379 541.835 379 551.5C379 561.165 384.373 569 391 569Z" fill="#fff"/>
                <g class="shine"><ellipse cx="391" cy="612" rx="27" ry="17" fill="url(#gloss)"/><ellipse class="hl1" cx="377" cy="548" rx="14" ry="18" fill="#fff"/><circle class="hl2" cx="406" cy="597" r="7" fill="#fff"/><circle class="hl3" cx="371" cy="602" r="4" fill="#fff"/></g>
                <g transform="translate(378 552) scale(40)"><path class="star" d="M0 -1C.11 -.32 .32 -.11 1 0C.32 .11 .11 .32 0 1C-.11 .32 -.32 .11 -1 0C-.32 -.11 -.11 -.32 0 -1Z" fill="#fff"/></g>
                <g transform="translate(406 600) scale(17)"><path class="star s2" d="M0 -1C.11 -.32 .32 -.11 1 0C.32 .11 .11 .32 0 1C-.11 .32 -.32 .11 -1 0C-.32 -.11 -.11 -.32 0 -1Z" fill="#fff"/></g>
              </g>
              <g id="fEyeR">
                <path d="M603 638C625.091 638 643 609.794 643 575C643 540.206 625.091 512 603 512C580.909 512 563 540.206 563 575C563 609.794 580.909 638 603 638Z" fill="#121212"/>
                <path class="dot" d="M603 569C609.627 569 615 561.165 615 551.5C615 541.835 609.627 534 603 534C596.373 534 591 541.835 591 551.5C591 561.165 596.373 569 603 569Z" fill="#fff"/>
                <g class="shine"><ellipse cx="603" cy="612" rx="27" ry="17" fill="url(#gloss)"/><ellipse class="hl1" cx="589" cy="548" rx="14" ry="18" fill="#fff"/><circle class="hl2" cx="618" cy="597" r="7" fill="#fff"/><circle class="hl3" cx="583" cy="602" r="4" fill="#fff"/></g>
                <g transform="translate(590 552) scale(40)"><path class="star" d="M0 -1C.11 -.32 .32 -.11 1 0C.32 .11 .11 .32 0 1C-.11 .32 -.32 .11 -1 0C-.32 -.11 -.11 -.32 0 -1Z" fill="#fff"/></g>
                <g transform="translate(618 600) scale(17)"><path class="star s2" d="M0 -1C.11 -.32 .32 -.11 1 0C.32 .11 .11 .32 0 1C-.11 .32 -.32 .11 -1 0C-.32 -.11 -.11 -.32 0 -1Z" fill="#fff"/></g>

            </g>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const LS = "figgy-todo-v1";

/* =================== Dữ liệu =================== */
const dayStr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const yesterday = () => { const d = new Date(); d.setDate(d.getDate()-1); return dayStr(d); };
const blank = () => ({ date: dayStr(), tasks: [], streak: 0, lastAllDone: "", updatedAt: 0 });

let S = blank();
try { const c = JSON.parse(localStorage.getItem(LS)); if (c && Array.isArray(c.tasks)) S = c; } catch {}

let mode = "daily";
let dbRef = null, writing = false, pending = false, saveT = 0;

function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch {} }
function commit(){
  S.updatedAt = Date.now();
  saveLocal();
  clearTimeout(saveT); saveT = setTimeout(pushRemote, 350);
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pending = true; return; }
  writing = true;
  try { await dbRef.set(JSON.parse(JSON.stringify(S))); setSync(""); }
  catch { setSync("Chưa lưu được lên mây, đang giữ trên máy"); }
  writing = false;
  if (pending){ pending = false; pushRemote(); }
}
function unwrap(x){
  if (x == null) return null;
  if (typeof x.data === "function") return x.data();
  if (x.data && typeof x.data === "object" && !Array.isArray(x.data)) return x.data;
  return x;
}
async function pullRemote(){
  if (!dbRef) return;
  try {
    const r = unwrap(await dbRef.get());
    if (r && Array.isArray(r.tasks) && (r.updatedAt || 0) > (S.updatedAt || 0)){
      S = r; saveLocal(); rollover(); render(true);
    } else if (!r || (r.updatedAt || 0) < (S.updatedAt || 0)) {
      pushRemote();
    }
  } catch {}
}
function setSync(t){ $("sync").textContent = t; }

async function connect(){
  if (!window.claude || !window.claude.use) return;
  const timer = setTimeout(() => setSync("Đang lưu trên máy"), 10000);
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user){ clearTimeout(timer); return; }
    const id = await user.id();
    if (!id){ clearTimeout(timer); return; }
    dbRef = db.collection("data/users/" + id).doc("todo");
    await pullRemote();
    clearTimeout(timer);
  } catch { clearTimeout(timer); }
}

/* Qua ngày mới */
function rollover(){
  const t = dayStr();
  if (S.date === t) return false;
  S.tasks = S.tasks.filter(k => k.daily || !k.done).map(k => ({ ...k, done: false }));
  S.date = t;
  if (S.lastAllDone !== yesterday() && S.lastAllDone !== t) S.streak = 0;
  commit();
  return true;
}

/* =================== Figgy =================== */
const svg = $("figgy"), wrap = $("figWrap"), shadow = $("fShadow");
const G = { head: $("fHead"), eyes: $("fEyes"), eyeL: $("fEyeL"), eyeR: $("fEyeR"), earL: $("fEarL"), earR: $("fEarR"), body: $("fBody") };
const spr = () => ({ x: 0, v: 0, t: 0 });
const P = { ex: spr(), ey: spr(), tilt: spr(), earL: spr(), earR: spr(), earY: spr(), lid: { x: 1, v: 0, t: 1 }, big: { x: 1, v: 0, t: 1 } };
let blinkUntil = 0, lookUntil = 0, last = performance.now(), breath = 0;

function step(s, k, d, dt){ s.v += (s.t - s.x) * k * dt; s.v *= Math.pow(d, dt * 60); s.x += s.v * dt; }

function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (now > lookUntil){ P.ex.t = 0; P.ey.t = 0; P.tilt.t = 0; }
  P.lid.t = now < blinkUntil ? .08 : 1;
  step(P.ex, 160, .78, dt); step(P.ey, 160, .78, dt); step(P.tilt, 120, .8, dt);
  step(P.earL, 260, .72, dt); step(P.earR, 260, .72, dt); step(P.earY, 200, .75, dt);
  step(P.lid, 900, .55, dt); step(P.big, 260, .72, dt);
  breath += dt;
  const b = reduce() ? 0 : Math.sin(breath * 2.1) * 0.012;

  G.head.setAttribute("transform", `rotate(${P.tilt.x.toFixed(2)} 500 640)`);
  G.body.setAttribute("transform", `translate(500 851) scale(${(1 + b*0.6).toFixed(4)} ${(1 - b).toFixed(4)}) translate(-500 -851)`);
  const sp = svg.classList.contains("sparkle") && !reduce();
  P.big.t = sp ? 1.24 : 1;
  const qx = sp ? Math.sin(now / 38) * 1.6 : 0, qy = sp ? Math.cos(now / 45) * 1.2 : 0;
  G.eyes.setAttribute("transform", `translate(${(P.ex.x + qx).toFixed(1)} ${(P.ey.x + qy).toFixed(1)})`);
  const l = Math.max(.05, P.lid.x).toFixed(3);
  const bg = P.big.x.toFixed(3), bl = (P.big.x * l).toFixed(3);
  G.eyeL.setAttribute("transform", `translate(391 585) scale(${bg} ${bl}) translate(-391 -585)`);
  G.eyeR.setAttribute("transform", `translate(603 585) scale(${bg} ${bl}) translate(-603 -585)`);
  G.earL.setAttribute("transform", `translate(0 ${P.earY.x.toFixed(1)}) rotate(${P.earL.x.toFixed(2)} 321 443)`);
  G.earR.setAttribute("transform", `translate(0 ${P.earY.x.toFixed(1)}) rotate(${P.earR.x.toFixed(2)} 679 443)`);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function blink(){ blinkUntil = performance.now() + 110; }
(function blinkLoop(){
  setTimeout(() => {
    if (!document.hidden && !reduce()){ blink(); if (Math.random() < .25) setTimeout(blink, 240); }
    blinkLoop();
  }, 1800 + Math.random() * 3400);
})();
(function earLoop(){
  setTimeout(() => {
    if (!document.hidden && !reduce()){
      if (Math.random() < .5) P.earL.v -= 260; else P.earR.v += 260;
    }
    earLoop();
  }, 2600 + Math.random() * 4200);
})();

function lookAt(x, y, hold = 1800){
  const r = svg.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height * .55;
  const dx = x - cx, dy = y - cy, len = Math.hypot(dx, dy) || 1, f = Math.min(1, len / 220);
  P.ex.t = dx / len * 24 * f; P.ey.t = dy / len * 14 * f;
  P.tilt.t = Math.max(-5, Math.min(5, dx / 60));
  lookUntil = performance.now() + hold;
}
addEventListener("pointerdown", (e) => lookAt(e.clientX, e.clientY), { passive: true });
addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" || e.buttons) lookAt(e.clientX, e.clientY, 1200); }, { passive: true });

function jump(big){
  if (reduce()) return;
  const h = big ? -34 : -16;
  wrap.animate([
    { transform: "translateY(0) scale(1,1)" },
    { transform: "translateY(4px) scale(1.06,.92)", offset: .18 },
    { transform: `translateY(${h}px) scale(.96,1.06)`, offset: .48 },
    { transform: "translateY(0) scale(1.05,.95)", offset: .8 },
    { transform: "translateY(0) scale(1,1)" }
  ], { duration: big ? 720 : 520, easing: "ease-out" });
  shadow.animate([{ transform: "scale(1)", opacity: 1 }, { transform: "scale(.65)", opacity: .5, offset: .48 }, { transform: "scale(1)", opacity: 1 }],
    { duration: big ? 720 : 520, easing: "ease-out" });
}
function perk(){ P.earY.v -= 900; P.earL.v += 300; P.earR.v -= 300; }
function droop(){ P.earL.t = -14; P.earR.t = 14; P.earY.t = 10; setTimeout(() => { P.earL.t = 0; P.earR.t = 0; P.earY.t = 0; }, 900); }
let faceT = 0;
function face(cls, ms){
  svg.classList.remove("starry", "happyface", "sparkle"); void svg.offsetWidth;
  svg.classList.add(cls);
  clearTimeout(faceT);
  if (ms) faceT = setTimeout(() => { svg.classList.remove(cls); syncFace(); }, ms);
}
function syncFace(){
  const total = S.tasks.length, done = S.tasks.filter(k => k.done).length;
  if (total && done === total) svg.classList.add("happyface");
}

$("figZone").addEventListener("click", () => {
  face("happyface", 1300); jump(false); perk();
  say(pick(["Meo~ ♡", "Grừ grừ…", "Hihi nhột quá!", "Vuốt nữa đi ní", "Figgy thương ní nhất"]), true);
  burst(...center($("figZone")), ["#F0A99C", "#EFE4D0"], 8, "heart");
});

/* =================== Câu thoại =================== */
const pick = (a) => a[Math.floor(Math.random() * a.length)];
let sayT = 0;
function say(text, temp){
  const b = $("bubble");
  if (b.textContent !== text){ b.textContent = text; b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }
  clearTimeout(sayT);
  if (temp) sayT = setTimeout(() => say(statusLine()), 2400);
}
function statusLine(){
  const total = S.tasks.length, done = S.tasks.filter(k => k.done).length, left = total - done;
  const h = new Date().getHours();
  if (!total) return "Figgy đang đói việc nè, thêm vài việc đi ní!";
  if (!left) return "Xong hết rồi! Thưởng ní một ly matcha latte";
  if (!done) return h < 11 ? `Chào buổi sáng! Hôm nay có ${total} việc nè` : `Có ${total} việc đang chờ ní đó`;
  if (left === 1) return "Còn đúng 1 việc nữa thôi, cố lên!";
  return `Còn ${left} việc nữa, ní làm tốt lắm`;
}

/* =================== Hiệu ứng hạt =================== */
function center(el){ const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
function burst(x, y, colors, n = 10, kind = "dot"){
  if (reduce()) return;
  const fx = $("fx");
  for (let i = 0; i < n; i++){
    const s = document.createElement("span");
    const a = (Math.PI * 2 * i) / n + Math.random() * .5, d = 34 + Math.random() * 30;
    const size = kind === "heart" ? 12 : 5 + Math.random() * 4;
    s.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;margin:-${size/2}px 0 0 -${size/2}px;`;
    if (kind === "heart"){ s.textContent = "♥"; s.style.cssText += `color:${colors[i % colors.length]};font-size:14px;line-height:1`; }
    else s.style.cssText += `border-radius:50%;background:${colors[i % colors.length]}`;
    fx.appendChild(s);
    s.animate([
      { transform: "translate(0,0) scale(.4)", opacity: 1 },
      { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d - (kind === "heart" ? 20 : 0)}px) scale(1)`, opacity: 1, offset: .6 },
      { transform: `translate(${Math.cos(a) * d * 1.2}px,${Math.sin(a) * d * 1.2 - (kind === "heart" ? 34 : 0)}px) scale(.6)`, opacity: 0 }
    ], { duration: 650 + Math.random() * 200, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => s.remove();
  }
}
function twinkles(){
  if (reduce()) return;
  const fx = $("fx"), r = svg.getBoundingClientRect();
  const spots = [[.18,.42],[.84,.40],[.12,.66],[.9,.64],[.5,.2],[.3,.28],[.72,.26]];
  spots.forEach(([fx_, fy_], i) => {
    const s = document.createElement("span");
    const size = 10 + Math.random() * 10;
    s.textContent = "✦";
    s.style.cssText = `left:${r.left + r.width*fx_}px;top:${r.top + r.height*fy_}px;font-size:${size}px;line-height:1;margin:-${size/2}px 0 0 -${size/2}px;color:${i % 2 ? "#EFE4D0" : "#B4CC84"};text-shadow:0 0 8px rgba(239,228,208,.8)`;
    fx.appendChild(s);
    s.animate([
      { transform: "scale(0) rotate(-30deg)", opacity: 0 },
      { transform: "scale(1.2) rotate(0)", opacity: 1, offset: .3 },
      { transform: "scale(.7) rotate(10deg)", opacity: .7, offset: .55 },
      { transform: "scale(1) rotate(0)", opacity: 1, offset: .75 },
      { transform: "scale(0) rotate(30deg)", opacity: 0 }
    ], { duration: 1300, delay: i * 90, easing: "ease-in-out", fill: "both" }).onfinish = () => s.remove();
  });
}
function confetti(){
  if (reduce()) return;
  const fx = $("fx"), [x, y] = center($("figZone"));
  const cols = ["#8DAE52", "#B4CC84", "#C9A882", "#EFE4D0", "#6F8F36"];
  for (let i = 0; i < 46; i++){
    const s = document.createElement("span");
    const w = 6 + Math.random() * 6, h = 4 + Math.random() * 8;
    s.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${cols[i % cols.length]};border-radius:${Math.random() < .4 ? "50%" : "2px"}`;
    fx.appendChild(s);
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, sp = 140 + Math.random() * 200;
    const tx = Math.cos(a) * sp, ty = Math.sin(a) * sp, fall = 260 + Math.random() * 300, r = (Math.random() - .5) * 900;
    s.animate([
      { transform: "translate(0,0) rotate(0)", opacity: 1 },
      { transform: `translate(${tx}px,${ty}px) rotate(${r / 2}deg)`, opacity: 1, offset: .35 },
      { transform: `translate(${tx * 1.3}px,${ty + fall}px) rotate(${r}deg)`, opacity: 0 }
    ], { duration: 1500 + Math.random() * 700, easing: "cubic-bezier(.15,.7,.4,1)" }).onfinish = () => s.remove();
  }
}

/* =================== Danh sách =================== */
const checkSvg = '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#12160B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let openRow = null, justAdded = null;

function buildItem(k){
  const li = document.createElement("li");
  li.dataset.id = k.id;
  if (k.done) li.classList.add("done");
  if (k.id === justAdded) li.classList.add("enter");
  li.innerHTML = `<div class="delbg"><button class="delbtn" type="button" aria-label="Xoá"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button></div>
    <div class="row glass"><span class="check">${checkSvg}</span><span class="txt"></span></div>`;
  li.querySelector(".txt").textContent = k.text;
  const row = li.querySelector(".row");
  const btn = li.querySelector(".delbtn");
  makeSwipe(li, row, btn, () => {
    const h = li.offsetHeight;
    li.animate([{ height: h + "px", marginBottom: "0px", opacity: 1 }, { height: "0px", marginBottom: "-10px", opacity: 0 }],
      { duration: 280, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" }).onfinish = () => removeTask(k.id, li, true);
  }, () => toggle(k.id, li));
  return li;
}

/* ---------- Vuốt để xoá: vật lý kiểu iOS ---------- */
const OPEN = 80;
function makeSwipe(li, row, btn, onDelete, onTap){
  let x = 0, raf = 0, W = 1, wasCommit = false;
  const apply = (v) => {
    x = v;
    row.style.transform = `translate3d(${v.toFixed(2)}px,0,0)`;
    const rev = Math.max(0, -v), commit = rev > W * .55;
    btn.style.width = Math.max(44, rev - 10) + "px";
    btn.style.transform = `scale(${(.35 + .65 * Math.min(1, rev / 56)).toFixed(3)})`;
    btn.style.opacity = Math.min(1, rev / 34).toFixed(3);
    if (commit !== wasCommit){
      li.classList.toggle("commit", commit); wasCommit = commit;
      if (commit && !reduce()) btn.animate([{ transform: btn.style.transform }, { transform: "scale(1.06)" }, { transform: btn.style.transform }], { duration: 260, easing: "ease-out" });
    }
  };
  const springTo = (target, v0, done) => {
    cancelAnimationFrame(raf);
    if (reduce()){ apply(target); done && done(); return; }
    let v = (v0 || 0) * 1000, last = performance.now();
    const k = 420, c = 2 * Math.sqrt(k) * .74;
    const f = (now) => {
      const dt = Math.min(.032, (now - last) / 1000); last = now;
      v += (-k * (x - target) - c * v) * dt;
      apply(x + v * dt);
      if (Math.abs(v) < 5 && Math.abs(x - target) < .4){ apply(target); done && done(); return; }
      raf = requestAnimationFrame(f);
    };
    raf = requestAnimationFrame(f);
  };
  const flyOut = () => {
    cancelAnimationFrame(raf);
    W = li.offsetWidth;
    const from = x, to = -W - 40, t0 = performance.now(), D = reduce() ? 1 : 260;
    const f = (now) => {
      const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
      apply(from + (to - from) * e);
      if (p < 1) raf = requestAnimationFrame(f); else { if (openRow === row) openRow = null; onDelete(); }
    };
    raf = requestAnimationFrame(f);
  };
  row._sw = { close: () => springTo(0, 0) };
  btn.onclick = (e) => { e.stopPropagation(); flyOut(); };

  let sx = 0, sy = 0, startX = 0, lock = null, drag = false, samples = [];
  row.addEventListener("pointerdown", (e) => {
    if (e.button) return;
    W = li.offsetWidth; cancelAnimationFrame(raf);
    sx = e.clientX; sy = e.clientY; startX = x; lock = null; drag = true;
    samples = [{ t: e.timeStamp, x: e.clientX }];
    if (openRow && openRow !== row) closeRow();
  });
  row.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (lock === null && (Math.abs(mx) > 6 || Math.abs(my) > 6)){
      lock = Math.abs(mx) > Math.abs(my) ? "x" : "y";
      if (lock === "x"){ try { row.setPointerCapture(e.pointerId); } catch {} li.classList.add("swiping"); }
    }
    if (lock !== "x") return;
    const raw = startX + mx;
    apply(raw > 0 ? 26 * (1 - Math.exp(-raw / 70)) : raw);   // kéo sang phải: cao su
    samples.push({ t: e.timeStamp, x: e.clientX });
    while (samples.length > 2 && e.timeStamp - samples[0].t > 90) samples.shift();
  });
  const end = (e) => {
    if (!drag) return; drag = false; li.classList.remove("swiping");
    if (lock === "x"){
      const a = samples[0], b = samples[samples.length - 1];
      const vel = b.t > a.t ? (b.x - a.x) / (b.t - a.t) : 0;   // px/ms, âm = sang trái
      const rev = -x;
      if (rev > W * .55 || (vel < -1.4 && rev > OPEN * .8)) flyOut();
      else if (vel < -.35 || (rev > OPEN * .5 && vel < .35)){ springTo(-OPEN, vel); openRow = row; }
      else { springTo(0, vel); if (openRow === row) openRow = null; }
    } else if (lock === null){
      if (openRow === row){ closeRow(); return; }
      onTap();
    }
  };
  row.addEventListener("pointerup", end);
  row.addEventListener("pointercancel", () => {
    if (!drag) return; drag = false; li.classList.remove("swiping");
    springTo(openRow === row ? -OPEN : 0, 0);
  });
}
function closeRow(){ if (openRow){ openRow._sw && openRow._sw.close(); openRow = null; } }

function renderList(ul, items, empty){
  ul.innerHTML = "";
  if (!items.length){ ul.innerHTML = `<div class="empty">${empty}</div>`; return; }
  [...items].sort((a, b) => a.done - b.done || a.created - b.created).forEach(k => ul.appendChild(buildItem(k)));
}

function render(quiet){
  const first = new Map();
  document.querySelectorAll("ul li[data-id]").forEach(li => first.set(li.dataset.id, li.getBoundingClientRect().top));
  const d = new Date();
  const thu = ["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"][d.getDay()];
  $("date").textContent = `${thu} · ${d.getDate()} tháng ${d.getMonth()+1}`;

  const daily = S.tasks.filter(k => k.daily), once = S.tasks.filter(k => !k.daily);
  renderList($("listDaily"), daily, "Chưa có việc lặp nào — thêm ở dưới nha");
  renderList($("listOnce"), once, "Trống trơn, thảnh thơi ghê");
  $("cDaily").textContent = daily.length ? `${daily.filter(k => k.done).length}/${daily.length}` : "";
  $("cOnce").textContent = once.length ? `${once.filter(k => k.done).length}/${once.length}` : "";

  const total = S.tasks.length, done = S.tasks.filter(k => k.done).length;
  $("pDone").textContent = done; $("pTotal").textContent = total;
  $("pFill").style.width = total ? (done / total * 100) + "%" : "0%";
  updateBadge(total - done);

  updateStreak();
  flip(first);

  if (!svg.classList.contains("sparkle")) svg.classList.toggle("happyface", !!total && done === total);
  if (!quiet) say(statusLine());
  justAdded = null;
}

/* ---------- Đổi chỗ: trượt + nảy (FLIP) ---------- */
function flip(first){
  if (reduce() || !first.size) return;
  document.querySelectorAll("ul li[data-id]").forEach(li => {
    const f = first.get(li.dataset.id); if (f == null) return;
    const d = f - li.getBoundingClientRect().top;
    if (Math.abs(d) < 2) return;
    const s = Math.sign(d);
    li.style.zIndex = d < 0 ? 3 : 1;
    li.animate([
      { transform: `translateY(${d}px) scale(1)` },
      { transform: `translateY(${d * .45}px) scale(1.035)`, offset: .4 },
      { transform: `translateY(${-s * 7}px) scale(1)`, offset: .72 },
      { transform: `translateY(${s * 2}px)`, offset: .88 },
      { transform: "none" }
    ], { duration: 620, easing: "cubic-bezier(.25,.8,.35,1)" }).onfinish = () => { li.style.zIndex = ""; };
  });
}

/* ---------- Chuỗi lửa ---------- */
let celebrating = false;
function streakInfo(){
  const today = S.lastAllDone === dayStr();
  const alive = today || S.lastAllDone === yesterday();
  return { today, n: alive ? (S.streak || 0) : 0 };
}
function updateStreak(){
  if (celebrating) return;
  const { today, n } = streakInfo(), chip = $("streak");
  chip.classList.toggle("lit", today);
  chip.classList.toggle("risk", !today && n > 0);
  $("streakN").textContent = n;
}
function rollNum(el, to){
  if (reduce()){ el.textContent = to; return; }
  el.animate([{ transform: "none", opacity: 1 }, { transform: "translateY(-90%)", opacity: 0 }], { duration: 170, easing: "ease-in" }).onfinish = () => {
    el.textContent = to;
    el.animate([{ transform: "translateY(90%)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 380, easing: "cubic-bezier(.34,1.56,.64,1)" });
  };
}
function celebrateStreak(n){
  const chip = $("streak");
  if (reduce()){ updateStreak(); return; }
  celebrating = true;
  const scrim = document.createElement("div"); scrim.className = "sp-scrim";
  const sp = document.createElement("div"); sp.className = "sp";
  sp.innerHTML = `<div class="sp-in"><div class="sp-flame">${chip.querySelector(".fl").outerHTML}</div><div class="sp-num">${Math.max(0, n - 1)}</div><div class="sp-txt">ngày liên tiếp!</div></div>`;
  document.body.append(scrim, sp);
  const inner = sp.firstChild, num = sp.querySelector(".sp-num");
  scrim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: "forwards" });
  inner.animate([
    { transform: "scale(.2) rotate(-12deg)", opacity: 0 },
    { transform: "scale(1.15) rotate(4deg)", opacity: 1, offset: .6 },
    { transform: "scale(1) rotate(0)", opacity: 1 }
  ], { duration: 560, easing: "cubic-bezier(.3,1.4,.5,1)", fill: "forwards" });
  setTimeout(() => {
    rollNum(num, n);
    const r = num.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, ["#FFC93C", "#FF7A1A", "#FF3B4E", "#FFE6A6"], 14);
  }, 520);
  setTimeout(() => {
    const a = inner.getBoundingClientRect(), b = chip.getBoundingClientRect();
    const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height * .3);
    scrim.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, fill: "forwards" });
    inner.animate([
      { transform: "none", opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) scale(.14)`, opacity: .6 }
    ], { duration: 520, easing: "cubic-bezier(.55,0,.7,.6)", fill: "forwards" }).onfinish = () => {
      sp.remove(); scrim.remove(); celebrating = false;
      chip.classList.add("lit"); chip.classList.remove("risk");
      rollNum($("streakN"), n);
      chip.animate([{ transform: "scale(1)" }, { transform: "scale(1.25)" }, { transform: "scale(1)" }], { duration: 480, easing: "cubic-bezier(.34,1.56,.64,1)" });
      const [x, y] = center(chip); burst(x, y, ["#FFC93C", "#FF7A1A", "#FFE6A6"], 10);
    };
  }, 1900);
}
$("streak").addEventListener("click", () => {
  const { today, n } = streakInfo();
  const fl = $("streak").querySelector(".fl");
  if (!reduce()) fl.animate([{ transform: "scale(1)" }, { transform: "scale(1.35) rotate(-8deg)" }, { transform: "scale(1)" }], { duration: 450, easing: "cubic-bezier(.34,1.56,.64,1)" });
  if (today) say(`Chuỗi ${n} ngày, lửa đang cháy rực!`, true);
  else if (n > 0) say(`Xong hết việc hôm nay để giữ lửa ${n} ngày nha!`, true);
  else say("Xong hết việc trong ngày để nhóm ngọn lửa đầu tiên!", true);
});

function addTask(text){
  const k = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text, daily: mode === "daily", done: false, created: Date.now() };
  S.tasks.push(k); justAdded = k.id; commit(); render(true);
  jump(false); perk();
  say(pick(["Figgy nhớ rồi nha!", "Ghi vô sổ rồi đó", "Okela, thêm 1 việc", "Nhận việc!"]), true);
  const el = document.querySelector(`li[data-id="${k.id}"]`);
  if (el){ const [x, y] = center(el); lookAt(x, y, 1500); }
}

function toggle(id, li){
  const k = S.tasks.find(t => t.id === id); if (!k) return;
  k.done = !k.done;
  const total = S.tasks.length, done = S.tasks.filter(t => t.done).length;
  if (k.done){
    li.classList.add("done");
    const [x, y] = center(li.querySelector(".check"));
    burst(x, y, ["#8DAE52", "#B4CC84", "#EFE4D0", "#C9A882"], 10);
    lookAt(x, y, 1400);
    if (done === total){
      let gained = false;
      if (S.lastAllDone !== dayStr()){
        S.streak = S.lastAllDone === yesterday() ? (S.streak || 0) + 1 : 1;
        S.lastAllDone = dayStr(); gained = true;
      }
      commit();
      if (gained) celebrating = true;
      setTimeout(() => { render(true); jump(true); perk(); confetti(); twinkles(); face("sparkle", 2000); say(statusLine()); }, 380);
      if (gained) setTimeout(() => { celebrating = false; celebrateStreak(S.streak); }, 1500);
      return;
    }
    commit();
    face("sparkle", 1700); twinkles(); jump(false); perk();
    setTimeout(() => render(true), 380);
    say(pick(["Ngon lành!", "Tuyệt cú mèo!", "Một điểm matcha cho ní", "Đỉnh nóc kịch trần", "Figgy tự hào ghê"]), true);
  } else {
    li.classList.remove("done");
    commit(); droop();
    setTimeout(() => render(true), 300);
    say("Ủa, chưa xong hả? Không sao đâu", true);
  }
}

let undoT = 0, lastRemoved = null;
function removeTask(id, li, instant){
  const i = S.tasks.findIndex(t => t.id === id); if (i < 0) return;
  lastRemoved = { task: S.tasks[i], index: i };
  S.tasks.splice(i, 1); commit(); openRow = null;
  if (!instant) li.classList.add("leave");
  setTimeout(() => render(true), instant ? 0 : 260);
  droop(); say("Bye bye việc đó…", true);
  $("toastMsg").textContent = "Đã xoá 1 việc";
  $("toast").classList.add("show");
  clearTimeout(undoT); undoT = setTimeout(() => $("toast").classList.remove("show"), 4000);
}
$("toastBtn").onclick = () => {
  if (!lastRemoved) return;
  S.tasks.splice(lastRemoved.index, 0, lastRemoved.task); justAdded = lastRemoved.task.id; lastRemoved = null;
  commit(); render(true); $("toast").classList.remove("show"); perk(); jump(false);
  say("Phù, giữ lại rồi nha", true);
};

/* =================== Thanh nhập =================== */
function setTab(t){
  if (t === mode) return;
  mode = t; closeRow();
  const tabs = $("tabs");
  [...tabs.querySelectorAll("button")].forEach(x => x.classList.toggle("on", x.dataset.t === t));
  tabs.classList.toggle("right", t === "once");
  const show = t === "daily" ? $("listDaily") : $("listOnce"), hide = t === "daily" ? $("listOnce") : $("listDaily");
  hide.hidden = true; show.hidden = false;
  show.classList.remove("in-l", "in-r"); void show.offsetWidth; show.classList.add(t === "daily" ? "in-l" : "in-r");
  $("inp").placeholder = t === "daily" ? "Thêm việc lặp mỗi ngày…" : "Thêm việc cho riêng hôm nay…";
  const [x, y] = center(tabs.querySelector("button.on")); lookAt(x, y, 1000); P.earL.v -= 120; P.earR.v += 120;
}
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setTab(b.dataset.t); });
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("inp").value.trim();
  if (!v){ $("inp").focus(); return; }
  addTask(v); $("inp").value = "";
});
$("inp").addEventListener("focus", () => { P.ex.t = 0; P.ey.t = 16; lookUntil = performance.now() + 4000; });
document.addEventListener("pointerdown", (e) => { if (openRow && !e.target.closest("li")) closeRow(); });

/* =================== Badge trên icon (iPhone: khi đã thêm ra màn hình chính) =================== */
function updateBadge(n){
  if (!("setAppBadge" in navigator)) return;
  try { (n > 0 ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {}); } catch {}
}
const standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
function updatePerm(){
  $("perm").hidden = !(standalone && "Notification" in window && Notification.permission === "default" && "setAppBadge" in navigator);
}
$("permBtn").onclick = async () => {
  try { await Notification.requestPermission(); } catch {}
  updatePerm(); render(true);
};
updatePerm();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

/* =================== Khởi động =================== */
function refresh(){ if (rollover()) render(); pullRemote(); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
setInterval(() => { if (rollover()) render(); }, 60000);

rollover(); render();
connect();
})();
</script>
